version: '3.8'

services:
  # ==========================================
  # CAPA DE PERSISTENCIA (BASES DE DATOS)
  # ==========================================
  db-ingestion:
    image: postgres:15-alpine
    container_name: db-ingestion
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: db_ingestion
    ports:
      - "5432:5432"
    volumes:
      - pg_data_ingestion:/var/lib/postgresql/data
    networks:
      - territorial_network

  db-transformation:
    image: postgres:15-alpine
    container_name: db-transformation
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: db_transformation
    ports:
      - "5433:5432"
    volumes:
      - pg_data_transformation:/var/lib/postgresql/data
    networks:
      - territorial_network

  db-analytics:
    image: postgres:15-alpine
    container_name: db-analytics
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: db_analytics
    ports:
      - "5434:5432"
    volumes:
      - pg_data_analytics:/var/lib/postgresql/data
    networks:
      - territorial_network

  db-ml:
    image: postgres:15-alpine
    container_name: db-ml
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: db_ml
    ports:
      - "5435:5432"
    volumes:
      - pg_data_ml:/var/lib/postgresql/data
    networks:
      - territorial_network

  db-recommendations:
    image: postgres:15-alpine
    container_name: db-recommendations
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: db_recommendations
    ports:
      - "5436:5432"
    volumes:
      - pg_data_recommendations:/var/lib/postgresql/data
    networks:
      - territorial_network

  db-model-store:
    image: postgres:15-alpine
    container_name: db-model-store
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: db_model_store
    ports:
      - "5439:5432"
    volumes:
      - pg_data_model_store:/var/lib/postgresql/data
    networks:
      - territorial_network

  db-configuration:
    image: postgres:15-alpine
    container_name: db-configuration
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: db_configuration
    ports:
      - "5437:5432"
    volumes:
      - pg_data_configuration:/var/lib/postgresql/data
    networks:
      - territorial_network

  db-audit:
    image: postgres:15-alpine
    container_name: db-audit
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: db_audit
    ports:
      - "5438:5432"
    volumes:
      - pg_data_audit:/var/lib/postgresql/data
    networks:
      - territorial_network

  # ==========================================
  # CAPA DE MICROSERVICIOS DE NEGOCIO
  # ==========================================

  ms-ingestion:
    build:
      context: ../ms-ingestion
      dockerfile: Dockerfile
    container_name: ms-ingestion
    env_file:
      - ../ms-ingestion/.env
    environment:
      - APP_PORT=8000
      - DATABASE_URL=postgresql+psycopg2://admin:admin_password@db-ingestion:5432/db_ingestion
    ports:
      - "8001:8000"
    volumes:
      - ../ms-ingestion:/app
    depends_on:
      - db-ingestion
    networks:
      - territorial_network

  ms-transform:
    build:
      context: ../ms-transform
      dockerfile: Dockerfile
    container_name: ms-transform
    env_file:
      - ../ms-transform/.env
    environment:
      - APP_PORT=8000
      - DATABASE_URL=postgresql+psycopg2://admin:admin_password@db-transformation:5432/db_transformation
      - INGESTION_SERVICE_URL=http://ms-ingestion:8000
    ports:
      - "8002:8000"
    volumes:
      - ../ms-transform:/app
    depends_on:
      - db-transformation
    networks:
      - territorial_network

  ms-auditoria:
    build:
      context: ../ms-auditoria
      dockerfile: Dockerfile
    container_name: ms-auditoria
    env_file:
      - ../ms-auditoria/.env
    environment:
      - APP_PORT=8000
      - DATABASE_URL=postgresql+psycopg2://admin:admin_password@db-audit:5432/db_audit
    ports:
      - "8003:8000"
    volumes:
      - ../ms-auditoria:/app
    depends_on:
      - db-audit
    networks:
      - territorial_network

  ms-configuration:
    build:
      context: ../ms-configuration
      dockerfile: Dockerfile
    container_name: ms-configuration
    env_file:
      - ../ms-configuration/.env
    environment:
      - APP_PORT=8000
      - DATABASE_URL=postgresql+psycopg2://admin:admin_password@db-configuration:5432/db_configuration
    ports:
      - "8004:8000"
    volumes:
      - ../ms-configuration:/app
    depends_on:
      - db-configuration
    networks:
      - territorial_network

  ms-analytics:
    build:
      context: ../ms-analytics
      dockerfile: Dockerfile
    container_name: ms-analytics
    env_file:
      - ../ms-analytics/.env
    environment:
      - APP_PORT=8000
      - DATABASE_URL=postgresql+psycopg2://admin:admin_password@db-analytics:5432/db_analytics
      - TRANSFORM_SERVICE_URL=http://ms-transform:8000
      - CONFIG_SERVICE_URL=http://ms-configuration:8000
    ports:
      - "8005:8000"
    volumes:
      - ../ms-analytics:/app
    depends_on:
      - db-analytics
      - ms-transform
    networks:
      - territorial_network

  ms-ml:
    build:
      context: ../ms-ml
      dockerfile: Dockerfile
    container_name: ms-ml
    env_file:
      - ../ms-ml/.env
    environment:
      - APP_PORT=8000
      - DATABASE_URL=postgresql+psycopg2://admin:admin_password@db-ml:5432/db_ml
      - MS_ANALYTICS_URL=http://ms-analytics:8000
      - CONFIG_SERVICE_URL=http://ms-analytics:8000
    ports:
      - "8006:8000"
    volumes:
      - ../ms-ml:/app
    depends_on:
      - db-ml
      - ms-analytics
    networks:
      - territorial_network

  ms-recommendations:
    build:
      context: ../ms-recommendations
      dockerfile: Dockerfile
    container_name: ms-recommendations
    env_file:
      - ../ms-recommendations/.env
    environment:
      - APP_PORT=8000
      - DATABASE_URL=postgresql+psycopg2://admin:admin_password@db-recommendations:5432/db_recommendations
      - MODEL_STORE_URL=postgresql+psycopg2://admin:admin_password@db-model-store:5432/db_model_store
      - MS_ANALYTICS_URL=http://ms-analytics:8000
      - MS_ML_URL=http://ms-ml:8000
    ports:
      - "8007:8000"
    volumes:
      - ../ms-recommendations:/app
    depends_on:
      - db-recommendations
      - db-model-store
      - ms-analytics
      - ms-ml
    networks:
      - territorial_network

  # ==========================================
  # CAPA DE ORQUESTACIÓN / EXPERIENCIA
  # ==========================================

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    env_file:
      - ../api-gateway/.env
    environment:
      - APP_PORT=8000
      - MS_INGESTION_URL=http://ms-ingestion:8000
      - FRONTEND_URL=http://localhost:3000
      - MS_TRANSFORM_URL=http://ms-transform:8000
      - MS_CONFIGURATION_URL=http://ms-configuration:8000
      - MS_ANALYTICS_URL=http://ms-analytics:8000
      - MS_ML_URL=http://ms-ml:8000
      - MS_RECOMMENDATIONS_URL=http://ms-recommendations:8000
    ports:
      - "8000:8000"
    volumes:
      - ../api-gateway:/app
    depends_on:
      - ms-ingestion
      - ms-transform
      - ms-auditoria
      - ms-configuration
      - ms-analytics
      - ms-ml
      - ms-recommendations
    networks:
      - territorial_network

  frontend-web:
    build:
      context: ../../data-frontend
      dockerfile: Dockerfile
    container_name: frontend-web
    ports:
      - "3000:3000"
    volumes:
      - ../../data-frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - API_GATEWAY_URL=http://api-gateway:8000
    depends_on:
      - api-gateway
    networks:
      - territorial_network

networks:
  territorial_network:
    driver: bridge

volumes:
  pg_data_ingestion:
  pg_data_transformation:
  pg_data_analytics:
  pg_data_ml:
  pg_data_recommendations:
  pg_data_model_store:
  pg_data_configuration:
  pg_data_audit: